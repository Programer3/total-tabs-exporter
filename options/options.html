<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Total Tab Exporter — Settings</title>
  <link rel="stylesheet" href="options.css">
</head>

<body>
  <header class="page-header">
    <div class="logo">⬡ <span data-i18n="extensionName">Total Tab Exporter</span></div>
    <p class="subtitle" data-i18n="optionsSubtitle">Preferences persist across all sessions and browser restarts.</p>
  </header>

  <main class="card">
    <h2 class="section-title" data-i18n="sectionExportDefaults">Export Defaults</h2>

    <div class="field-group">
      <label for="default-format" class="field-label" data-i18n="labelDefaultFormat">Default Format</label>
      <select id="default-format" class="select">
        <option value="markdown">Markdown (.md)</option>
        <option value="json">JSON (.json)</option>
        <option value="html">HTML (.html)</option>
        <option value="text">Plain Text (.txt)</option>
      </select>
    </div>

    <div class="field-group">
      <label for="default-output" class="field-label" data-i18n="labelDefaultOutput">Default Output</label>
      <select id="default-output" class="select">
        <option value="download" data-i18n="outputDownload">Download File</option>
        <option value="clipboard" data-i18n="outputClipboard">Copy to Clipboard</option>
      </select>
    </div>

    <hr class="divider">
    <h2 class="section-title" data-i18n="sectionContentOptions">Content Options</h2>

    <div class="toggle-row">
      <div>
        <div class="toggle-label" data-i18n="optIncludeTitle">Include Tab Title</div>
        <div class="toggle-desc" data-i18n="descIncludeTitle">Include the tab title in exported output</div>
      </div>
      <label class="toggle" for="include-title">
        <input type="checkbox" id="include-title">
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
      </label>
    </div>

    <div class="toggle-row">
      <div>
        <div class="toggle-label" data-i18n="optFilterInternal">Filter Internal Pages</div>
        <div class="toggle-desc" data-i18n="descFilterInternal">Exclude about:, moz-extension:, and other internal URLs</div>
      </div>
      <label class="toggle" for="filter-internal">
        <input type="checkbox" id="filter-internal">
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
      </label>
    </div>

    <hr class="divider">

    <div class="btn-row">
      <button id="reset-btn" class="btn btn-ghost">↺ <span data-i18n="btnReset">Reset to Defaults</span></button>
      <button id="save-btn" class="btn btn-primary" data-i18n="btnSave">Save Settings</button>
    </div>

    <p id="status-msg" hidden class="status-msg"></p>
  </main>

  <script src="options.js"></script>
</body>

</html>
