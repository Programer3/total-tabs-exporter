<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Total Tab Exporter</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <header class="header">
    <div class="logo-row">
      <span class="logo-icon">⬡</span>
      <span class="logo-text" data-i18n="popupTitle">Total Tab Exporter</span>
    </div>
    <button id="settings-btn" class="icon-btn" data-i18n-aria="ariaSettings" aria-label="Open settings"
      data-i18n-tip="tipSettings">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3" />
        <path
          d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
      </svg>
    </button>
  </header>

  <!-- Tab count summary -->
  <div id="tab-summary" class="tab-summary"
    data-i18n-tip="tipTabSummary"
    aria-live="polite">
    <span class="summary-count" id="tab-count">—</span>
    <span class="summary-label" data-i18n="labelTabsReady">tabs ready to export</span>
  </div>

  <div class="divider"></div>

  <!-- Format selection -->
  <section class="section" data-i18n-aria="labelFormat" aria-label="Export Format">
    <div class="section-label" data-i18n="labelFormat">Format</div>
    <div class="format-grid" role="radiogroup" data-i18n-aria="labelFormat" aria-label="Export format">

      <label class="format-card" for="fmt-markdown"
        data-i18n-tip="tipFormatMarkdown">
        <input type="radio" id="fmt-markdown" name="format" value="markdown" checked>
        <span class="fmt-icon">MD</span>
        <span class="fmt-name" data-i18n="formatMarkdown">Markdown</span>
      </label>

      <label class="format-card" for="fmt-json"
        data-i18n-tip="tipFormatJson">
        <input type="radio" id="fmt-json" name="format" value="json">
        <span class="fmt-icon">{}</span>
        <span class="fmt-name" data-i18n="formatJson">JSON</span>
      </label>

      <label class="format-card" for="fmt-html"
        data-i18n-tip="tipFormatHtml">
        <input type="radio" id="fmt-html" name="format" value="html">
        <span class="fmt-icon">&lt;/&gt;</span>
        <span class="fmt-name" data-i18n="formatHtml">HTML</span>
      </label>

      <label class="format-card" for="fmt-text"
        data-i18n-tip="tipFormatText">
        <input type="radio" id="fmt-text" name="format" value="text">
        <span class="fmt-icon">TXT</span>
        <span class="fmt-name" data-i18n="formatText">Text</span>
      </label>

    </div>
  </section>

  <!-- Scope selection -->
  <section class="section" data-i18n-aria="labelScope" aria-label="Export Scope">
    <div class="section-label">
      <span data-i18n="labelScope">Scope</span>
      <span class="help-badge"
        data-i18n-tip="tipScope">?</span>
    </div>
    <div class="scope-row">
      <select id="scope-select" class="select" data-i18n-aria="labelScope" aria-label="Export scope">
        <option value="all" data-i18n="scopeAll">🌐 All Tabs</option>
        <option value="ungrouped" data-i18n="scopeUngrouped">🔗 Default / Ungrouped</option>
        <!-- Groups and containers are injected dynamically by popup.js -->
      </select>
      <button id="refresh-scope" class="icon-btn" data-i18n-aria="ariaRefresh" aria-label="Refresh groups and containers list"
        data-i18n-tip="tipRefresh">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="23 4 23 10 17 10" />
          <polyline points="1 20 1 14 7 14" />
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />
        </svg>
      </button>
    </div>
  </section>

  <!-- Options row -->
  <section class="section" data-i18n-aria="labelOptions" aria-label="Export Options">
    <div class="section-label" data-i18n="labelOptions">Options</div>
    <div class="options-row">

      <label class="toggle-label-row" for="opt-title">
        <span class="opt-text">
          <span data-i18n="optIncludeTitle">Include tab title</span>
          <span class="help-badge"
            data-i18n-tip="tipOptTitle">?</span>
        </span>
        <label class="toggle" for="opt-title">
          <input type="checkbox" id="opt-title" checked>
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
        </label>
      </label>

      <label class="toggle-label-row" for="opt-filter">
        <span class="opt-text">
          <span data-i18n="optFilterInternal">Filter internal pages</span>
          <span class="help-badge"
            data-i18n-tip="tipOptFilter">?</span>
        </span>
        <label class="toggle" for="opt-filter">
          <input type="checkbox" id="opt-filter" checked>
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
        </label>
      </label>

    </div>
  </section>

  <div class="divider"></div>

  <!-- Export actions -->
  <div class="action-row">
    <button id="btn-download" class="btn btn-primary" data-i18n-aria="ariaDownload" aria-label="Download export file"
      data-i18n-tip="tipDownload">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
        <polyline points="7 10 12 15 17 10" />
        <line x1="12" y1="15" x2="12" y2="3" />
      </svg>
      <span data-i18n="btnDownload">Download</span>
    </button>
    <button id="btn-copy" class="btn btn-secondary" data-i18n-aria="ariaCopy" aria-label="Copy to clipboard"
      data-i18n-tip="tipCopy">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
      </svg>
      <span data-i18n="btnCopy">Copy</span>
    </button>
  </div>

  <!-- Progress/Status bar -->
  <div id="status-bar" class="status-bar" hidden aria-live="polite">
    <div class="status-inner">
      <span class="spinner" aria-hidden="true"></span>
      <span id="status-text" data-i18n="statusPreparing">Preparing…</span>
    </div>
  </div>


  <!-- Toast notification -->
  <div id="toast" class="toast" hidden aria-live="polite"></div>

  <script type="module" src="popup.js"></script>
</body>

</html>
